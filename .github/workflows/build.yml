name: Build and Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: yt-music-win.zip
            executable_name: yt_music.exe
          - os: ubuntu-latest
            asset_name: yt-music-linux.zip
            executable_name: yt_music

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Build Dependencies
        run: |
          pip install -r requirements.txt
          pip install nuitka pydantic zstandard certifi

      - name: Install OS Specific Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev build-essential
        
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev || sudo apt-get install -y libwebkit2gtk-4.0-dev
          
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Packaging Tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ruby ruby-dev rubygems libarchive-tools
          sudo gem install fpm

      - name: Pre-download Webview Binaries (Linux)
        if: runner.os == 'Linux'
        run: python -c "import webview"

      - name: Build with Nuitka
        run: python build.py

      - name: Prepare Release Folder
        shell: bash
        run: |
          mkdir -p release_dir
          cp -r main.dist/. release_dir/
          if [ -d "plugins" ]; then cp -r plugins release_dir/plugins/; fi
          find release_dir/plugins -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          
          # --- THE FIX: MANUALLY INJECT WEBVIEW BINARIES ---
          # We create the folder the app is looking for
          mkdir -p release_dir/webview
          
          # We download the exact file the app is requesting directly into the bundle
          if [ "$RUNNER_OS" == "Linux" ]; then
            echo "Injecting Linux webview library..."
            curl -L -o release_dir/webview/libwebview.x86_64.so https://github.com/webview/webview_deno/releases/download/0.9.0/libwebview.x86_64.so
          elif [ "$RUNNER_OS" == "Windows" ]; then
            echo "Injecting Windows webview library..."
            curl -L -o release_dir/webview/webview.dll https://github.com/webview/webview_deno/releases/download/0.9.0/webview.dll
          fi
          
          find release_dir -exec touch {} +

      # -- REPLACED ZIP ACTION WITH NATIVE PYTHON --
      - name: Zip Release (Cross-Platform)
        run: |
          python -c "import shutil; shutil.make_archive('${{ matrix.asset_name }}'.replace('.zip', ''), 'zip', 'release_dir')"

      - name: Build Arch & Debian Packages
        if: runner.os == 'Linux'
        run: |
          mkdir -p pkg_root/opt/yt-music
          mkdir -p pkg_root/usr/bin
          mkdir -p pkg_root/usr/share/applications

          cp -a release_dir/* pkg_root/opt/yt-music/
          sudo chmod -R 777 pkg_root/opt/yt-music/

          ln -s /opt/yt-music/${{ matrix.executable_name }} pkg_root/usr/bin/yt-music

          cat <<EOF > pkg_root/usr/share/applications/yt-music.desktop
          [Desktop Entry]
          Name=YT Music
          Exec=/usr/bin/yt-music
          Icon=audio-x-generic
          Type=Application
          Categories=AudioVideo;Audio;Player;
          EOF

          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then VERSION="1.0.0"; fi

          fpm -s dir -t pacman -n yt-music -v "$VERSION" -d "webkitgtk-6.0" -d "gtk4" --architecture x86_64 -p yt-music-arch.pkg.tar.zst -C pkg_root .

          fpm -s dir -t deb -n yt-music -v "$VERSION" -d "libwebkitgtk-6.0-4" -d "libgtk-4-1" --architecture amd64 -p yt-music-ubuntu.deb -C pkg_root .

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          fail_on_unmatched_files: false # Crucial! Prevents failing on Windows when .deb and .pkg.tar.zst are not found
          files: |
            ${{ matrix.asset_name }}
            *.pkg.tar.zst
            *.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}