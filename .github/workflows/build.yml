name: Build and Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: yt-music-win.zip
            executable_name: yt_music.exe
          - os: ubuntu-latest
            asset_name: yt-music-linux.zip
            executable_name: yt_music

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Build Dependencies
        run: |
          pip install -r requirements.txt
          pip install nuitka pydantic zstandard

      - name: Install OS Specific Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev python3-dev build-essential \
            libwebkit2gtk-4.1-dev || sudo apt-get install -y libwebkit2gtk-4.0-dev

      - name: Build with Nuitka
        run: python build.py

      - name: Prepare Release Folder
        shell: bash
        run: |
          mkdir release_dir
          cp "${{ matrix.executable_name }}" release_dir/
          cp -r plugins release_dir/
          find release_dir/plugins -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          find release_dir -exec touch {} +

      - name: Zip Release
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: 'zip'
          # We tell it to name the file in the parent directory (root)
          filename: '../${{ matrix.asset_name }}' 
          directory: 'release_dir'

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          # Now it will find the file in the root
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}